<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Singularity black hole animation">
  <defs>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="400" cy="180" r="240">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#00f5ff" stop-opacity="0.38"/>
      <stop offset="0.7" stop-color="#0099ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0099ff"/>
      <stop offset="0.3" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#ffd700"/>
      <stop offset="0.7" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#0099ff"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="360" rx="12" fill="#020812"/>
  <rect x="0.5" y="0.5" width="799" height="359" rx="12" fill="none" stroke="#00f5ff" stroke-opacity="0.25"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="50" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="290" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="90" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="250" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="180" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="40" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="300" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="60" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="230" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="120" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="300" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="30" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="330" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="150" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="320" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="320" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#00f5ff">
    <circle cx="130" cy="140" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="110" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="190" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="180" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HUD text -->
  <text x="22" y="28" font-family="'Courier New', Courier, monospace" font-size="11" fill="#00f5ff" fill-opacity="0.7" letter-spacing="2">HR.ALLIANCE // DOJO-OF-LIMITS-SYS v7.4.2</text>
  <text x="778" y="28" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" fill="#00ff88" letter-spacing="2">
    ● SYSTEM_ONLINE
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- outer glow -->
  <circle cx="400" cy="180" r="240" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- slow rotating outer dashed ring -->
  <circle cx="400" cy="180" r="125" fill="none" stroke="#ffd700" stroke-opacity="0.3" stroke-dasharray="3 10">
    <animateTransform attributeName="transform" type="rotate" from="0 400 180" to="360 400 180" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="180" r="150" fill="none" stroke="#00f5ff" stroke-opacity="0.18" stroke-dasharray="1 8">
    <animateTransform attributeName="transform" type="rotate" from="360 400 180" to="0 400 180" dur="55s" repeatCount="indefinite"/>
  </circle>

  <!-- accretion disk (back) -->
  <g transform="rotate(-14 400 180)">
    <ellipse cx="400" cy="180" rx="190" ry="46" fill="none" stroke="url(#disk)" stroke-width="16" stroke-opacity="0.55" filter="url(#blur)"/>
    <ellipse cx="400" cy="180" rx="190" ry="46" fill="none" stroke="url(#disk)" stroke-width="5" stroke-opacity="0.9"/>
    <ellipse cx="400" cy="180" rx="168" ry="38" fill="none" stroke="#ffd700" stroke-width="1.6" stroke-opacity="0.85" stroke-dasharray="28 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-168" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="180" rx="210" ry="52" fill="none" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="14 22">
      <animate attributeName="stroke-dashoffset" from="0" to="-144" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- event horizon -->
  <circle cx="400" cy="180" r="58" fill="none" stroke="#00f5ff" stroke-width="3" stroke-opacity="0.65" filter="url(#soft)">
    <animate attributeName="r" values="56;61;56" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.45;0.9;0.45" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="180" r="48" fill="#000000" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.9"/>

  <!-- accretion disk (front half passes over the core) -->
  <g transform="rotate(-14 400 180)">
    <path d="M210 180 A190 46 0 0 0 590 180" fill="none" stroke="url(#disk)" stroke-width="5" stroke-linecap="round"/>
    <path d="M232 180 A168 38 0 0 0 568 180" fill="none" stroke="#ffd700" stroke-width="1.6" stroke-opacity="0.9" stroke-dasharray="28 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-168" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- lensed light arc over the top -->
  <path d="M345 150 A70 62 0 0 1 455 150" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.7" filter="url(#soft)"/>

  <!-- particles spiraling into the singularity -->
  <g>
    <circle r="3" fill="#ffffff">
      <animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M 740 70 C 600 20, 430 30, 360 110 C 320 160, 380 215, 430 190 C 455 175, 425 160, 400 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;3;1" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#00f5ff">
      <animateMotion dur="5s" begin="1.6s" repeatCount="indefinite" path="M 740 70 C 600 20, 430 30, 360 110 C 320 160, 380 215, 430 190 C 455 175, 425 160, 400 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="5s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;3;1" keyTimes="0;0.6;1" dur="5s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#ffd700">
      <animateMotion dur="5s" begin="3.2s" repeatCount="indefinite" path="M 740 70 C 600 20, 430 30, 360 110 C 320 160, 380 215, 430 190 C 455 175, 425 160, 400 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="5s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;3;1" keyTimes="0;0.6;1" dur="5s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(800 0) scale(-1 1)">
    <circle r="2.5" fill="#00f5ff">
      <animateMotion dur="6s" begin="0.8s" repeatCount="indefinite" path="M 740 300 C 600 340, 430 330, 360 250 C 320 200, 380 150, 430 170 C 455 185, 425 200, 400 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#ffffff">
      <animateMotion dur="6s" begin="3.8s" repeatCount="indefinite" path="M 740 300 C 600 340, 430 330, 360 250 C 320 200, 380 150, 430 170 C 455 185, 425 200, 400 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <text x="400" y="322" text-anchor="middle" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="9" fill="#00f5ff">
    SINGULARITY
    <animate attributeName="fill-opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="345" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="3" fill="#ffd700" fill-opacity="0.85">吞噬星空 · SWALLOWED STAR · OPERATOR: KAVIN THORIQ</text>
</svg>
