<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="Animated Linux terminal writing code">
  <defs>
    <clipPath id="c1"><rect x="24" y="70" width="0" height="22"><animate attributeName="width" values="0;0;370;370;0" keyTimes="0;0.025;0.15;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="24" y="98" width="0" height="22"><animate attributeName="width" values="0;0;230;230;0" keyTimes="0;0.175;0.225;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="24" y="126" width="0" height="22"><animate attributeName="width" values="0;0;280;280;0" keyTimes="0;0.2375;0.325;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="24" y="154" width="0" height="22"><animate attributeName="width" values="0;0;215;215;0" keyTimes="0;0.3375;0.4;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="24" y="182" width="0" height="22"><animate attributeName="width" values="0;0;360;360;0" keyTimes="0;0.4125;0.5125;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="24" y="210" width="0" height="22"><animate attributeName="width" values="0;0;24;24;0" keyTimes="0;0.525;0.5375;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c7"><rect x="24" y="238" width="0" height="22"><animate attributeName="width" values="0;0;380;380;0" keyTimes="0;0.5625;0.6625;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c8"><rect x="24" y="266" width="0" height="22"><animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.6875;0.7625;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c9"><rect x="24" y="294" width="0" height="22"><animate attributeName="width" values="0;0;190;190;0" keyTimes="0;0.7875;0.794;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <filter id="tglow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect width="800" height="350" rx="12" fill="#020812"/>
  <rect x="0.5" y="0.5" width="799" height="349" rx="12" fill="none" stroke="#00f5ff" stroke-opacity="0.3"/>
  <path d="M0 12 A12 12 0 0 1 12 0 H788 A12 12 0 0 1 800 12 V40 H0 Z" fill="#06142a"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#00f5ff" stroke-opacity="0.2"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="400" y="25" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#00f5ff" fill-opacity="0.8" letter-spacing="1">kavin@hr-alliance: ~/swallowed-star</text>

  <!-- code lines -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace" font-size="14" filter="url(#tglow)">
    <g clip-path="url(#c1)"><text x="24" y="86"><tspan fill="#00ff88">kavin@hr-alliance</tspan><tspan fill="#d0e8ff">:</tspan><tspan fill="#0099ff">~</tspan><tspan fill="#d0e8ff">$ </tspan><tspan fill="#ffd700">nano</tspan><tspan fill="#d0e8ff"> hello_universe.js</tspan></text></g>
    <g clip-path="url(#c2)"><text x="24" y="114" fill="#5b7a99">// --- hello_universe.js ---</text></g>
    <g clip-path="url(#c3)"><text x="24" y="142"><tspan fill="#ff7ab2">const</tspan><tspan fill="#d0e8ff"> operator = </tspan><tspan fill="#00ff88">"Kavin Thoriq"</tspan><tspan fill="#d0e8ff">;</tspan></text></g>
    <g clip-path="url(#c4)"><text x="24" y="170"><tspan fill="#ff7ab2">function</tspan><tspan fill="#00f5ff"> awaken</tspan><tspan fill="#d0e8ff">(power) {</tspan></text></g>
    <g clip-path="url(#c5)"><text x="24" y="198" xml:space="preserve"><tspan fill="#d0e8ff">  </tspan><tspan fill="#ff7ab2">return</tspan><tspan fill="#d0e8ff"> power * </tspan><tspan fill="#ffd700">Infinity</tspan><tspan fill="#d0e8ff">; </tspan><tspan fill="#5b7a99">// singularity</tspan></text></g>
    <g clip-path="url(#c6)"><text x="24" y="226" fill="#d0e8ff">}</text></g>
    <g clip-path="url(#c7)"><text x="24" y="254"><tspan fill="#00ff88">kavin@hr-alliance</tspan><tspan fill="#d0e8ff">:</tspan><tspan fill="#0099ff">~</tspan><tspan fill="#d0e8ff">$ </tspan><tspan fill="#ffd700">node</tspan><tspan fill="#d0e8ff"> hello_universe.js</tspan></text></g>
    <g clip-path="url(#c8)"><text x="24" y="282" fill="#00f5ff">&gt; OPERATOR AWAKENED... THREAT_LV: 0</text></g>
    <g clip-path="url(#c9)"><text x="24" y="310"><tspan fill="#00ff88">kavin@hr-alliance</tspan><tspan fill="#d0e8ff">:</tspan><tspan fill="#0099ff">~</tspan><tspan fill="#d0e8ff">$ </tspan></text></g>
  </g>

  <!-- blinking cursor -->
  <rect x="197" y="297" width="9" height="16" fill="#00ff88">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- CRT scanline sweep -->
  <rect x="0" y="40" width="800" height="40" fill="url(#scan)">
    <animate attributeName="y" values="40;310;40" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
